[package]
name = "dom-wallet-swap-client"
description = "User-side (Initiator) client of the DOM interop F6 RFQ flow: authors RfqV1 from the wallet's durable intent, signs ratified relay envelopes with the pinned BIP340 backend, runs the §5.4 acceptance pipeline and §4.1 admissibility on incoming quotes, and freezes TermsBindingV1 on acceptance. Fail-closed: without an operator-supplied network descriptor and transport, nothing is sent."
